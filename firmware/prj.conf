# ExecuTorch runtime, selective operator build
CONFIG_EXECUTORCH=y
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n
CONFIG_EXECUTORCH_ENABLE_LOGGING=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_MAIN_STACK_SIZE=12288
CONFIG_HEAP_MEM_POOL_SIZE=16384

# -O2: the portable kernels are generic loops; this is worth ~2x on the Xtensa
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_PRINTK=y

# Microphone over I2S0, SK6812 LED over SPI, button on GPIO39
CONFIG_I2S=y
CONFIG_I2S_ESP32_RX_BLOCK_COUNT=6
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_GPIO=y

# The ESP32-PICO-D4 in the ATOM Echo is a chip revision 1 part
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=32768
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=8192
